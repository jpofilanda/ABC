<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccination Management</title>

    <link rel="stylesheet" href="vaccines.css">
</head>
<body>

<div class="container">

    <div class="sidebar">

        <h2>ABC Admin</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="patients.html">Patients</a></li>
            <li><a href="appointments.html">Appointments</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="vaccines.html">Vaccinations</a></li>
        </ul>

    </div>

    <div class="main-content">

        <h1>Vaccination Management</h1>

        <div class="form-container">

            <form id="vaccineForm">

                <input type="hidden" id="editIndex">

                <input
                    type="text"
                    id="patientName"
                    placeholder="Patient Name"
                    required
                >

                <input
                    type="text"
                    id="vaccineType"
                    placeholder="Vaccine Type"
                    required
                >

                <input
                    type="text"
                    id="doseNumber"
                    placeholder="Dose Number"
                    required
                >

                <input
                    type="date"
                    id="vaccinationDate"
                    required
                >

                <select id="vaccinationStatus" required>
                    <option value="">Vaccination Status</option>
                    <option>Fully Vaccinated</option>
                    <option>Partially Vaccinated</option>
                    <option>Not Vaccinated</option>
                </select>

                <button type="submit">
                    Save Record
                </button>

            </form>

        </div>

        <div class="search-box">

            <input
                type="text"
                id="searchVaccine"
                placeholder="Search Vaccination Record..."
            >

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Patient</th>
                        <th>Vaccine Type</th>
                        <th>Dose</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="vaccineTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="vaccines.js"></script>

</body>
</html>
